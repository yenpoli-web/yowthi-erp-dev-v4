name: dotnet-self-hosted

on:
  push:
    branches:
      - 'm*-validation'
      - 'p*-validation'

permissions:
  contents: read

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  validation:
    runs-on: [self-hosted, yowthi-erp-v2]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show .NET SDK
        run: dotnet --info

      - name: Build Development Agent
        run: dotnet build src/YowThi.DevelopmentAgent3/YowThi.DevelopmentAgent3.csproj --configuration Release --nologo

      - name: Build Runtime Supervisor
        run: dotnet build src/YowThi.RuntimeSupervisor/YowThi.RuntimeSupervisor.csproj --configuration Release --nologo

      - name: Build Runtime Supervisor Updater
        run: dotnet build src/YowThi.RuntimeSupervisorUpdater/YowThi.RuntimeSupervisorUpdater.csproj --configuration Release --nologo

      - name: Run .NET acceptance tests
        run: dotnet test src/YowThi.DotnetAcceptanceTests/YowThi.DotnetAcceptanceTests.csproj --configuration Release --nologo --verbosity normal
