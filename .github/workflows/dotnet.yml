name: dotnet-self-hosted

on:
  push:
    branches:
      - 'm*-validation'
      - 'p*-validation'

permissions:
  contents: read

defaults:
  run:
    shell: cmd

env:
  DOTNET_NOLOGO: '1'
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'

jobs:
  environment:
    runs-on: [self-hosted, yowthi-erp-dev-v4]
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show .NET SDK
        run: '"C:\Program Files\dotnet\dotnet.exe" --info'

  agent-build:
    runs-on: [self-hosted, yowthi-erp-dev-v4]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Development Agent
        run: '"C:\Program Files\dotnet\dotnet.exe" build src\YowThi.DevelopmentAgent3\YowThi.DevelopmentAgent3.csproj --configuration Release --nologo'

  supervisor-build:
    runs-on: [self-hosted, yowthi-erp-dev-v4]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Runtime Supervisor
        run: '"C:\Program Files\dotnet\dotnet.exe" build src\YowThi.RuntimeSupervisor\YowThi.RuntimeSupervisor.csproj --configuration Release --nologo'

  updater-build:
    runs-on: [self-hosted, yowthi-erp-dev-v4]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Runtime Supervisor Updater
        run: '"C:\Program Files\dotnet\dotnet.exe" build src\YowThi.RuntimeSupervisorUpdater\YowThi.RuntimeSupervisorUpdater.csproj --configuration Release --nologo'

  deployment-executor-build:
    runs-on: [self-hosted, yowthi-erp-dev-v4]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Runtime Deployment Executor
        run: '"C:\Program Files\dotnet\dotnet.exe" build src\YowThi.RuntimeDeploymentExecutor\YowThi.RuntimeDeploymentExecutor.csproj --configuration Release --nologo'

  deployment-authorizer-build:
    runs-on: [self-hosted, yowthi-erp-dev-v4]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build Runtime Deployment Authorizer
        run: '"C:\Program Files\dotnet\dotnet.exe" build src\YowThi.RuntimeDeploymentAuthorizer\YowThi.RuntimeDeploymentAuthorizer.csproj --configuration Release --nologo'

  acceptance-tests:
    runs-on: [self-hosted, yowthi-erp-dev-v4]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run .NET acceptance tests
        run: '"C:\Program Files\dotnet\dotnet.exe" test src\YowThi.DotnetAcceptanceTests\YowThi.DotnetAcceptanceTests.csproj --configuration Release --nologo --verbosity normal'
